[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ti-mcp"
version = "0.1.0"
description = "A modular MCP server for passive threat-intelligence lookups."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
ti-mcp = "ti_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ti_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
